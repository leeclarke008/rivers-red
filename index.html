<!DOCTYPE html>

<html>
<head>
    <title>Rivers Red - Home</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <script defer src="./script.js"></script>
</head>
<body>
    <header class="hero">
        <h1 class="logo-hero">Rivers Red</h1>
        <nav class="topnav">
            <a href="./index.html">Home</a>
            <a href="./the-band.html">The Band</a>
            <a href="./music.html">Music</a>
            <a href="./gallery.html">Gallery</a>
            <a href="./contact.html">Contact</a>
        </nav>
    </header>
    <main class="content">
        <h1 class="page-heading">Home</h1>
        <div class="home-section home-band">
            <h2>Rivers Red</h2>
            <img class="home-band-shot" src="images/image2.jpg" />
            <button class="link-button">Meet the band</button>
        </div>
        <div class="home-section home-releases">
            <h2>Latest Releases</h2>
            <div class="home-releases-item">
                <img class="release-item-artwork" src="images/placeholder1.jpg" />

                    <h3>Title</h3>
                    <p>(Coming 2027)</p>
                </div>
            </div>
            <button class="link-button">To Music</button>
        </div>
        <div class="home-section home-news">
            <h2>News</h2>
            <img class="news-panel" src="images/image2.jpg" />
            <button class="link-button">See more on [social]</button>
        </div>
    </main>
    <footer>
        <div class="footer-socials">
            <div class="footer-socials-left">
                <button class="social-button">Facebook</button>
                <button class="social-button">Spotify</button>
            </div>
            <h3>Rivers Red</h3>
            <div class="footer-socials-right">
                <button class="social-button">Instagram</button>
                <button class="social-button">Reverbnation</button>
            </div>
        </div>
        <nav class="bottomnav">
            <a href="./index.html">Home</a>
            <a href="./the-band.html">The Band</a>
            <a href="./music.html">Music</a>
            <a href="./gallery.html">Gallery</a>
            <a href="./contact.html">Contact</a>
        </nav>
        <p>&copy; Rivers Red 2026.</p>
    </footer>

</html>
